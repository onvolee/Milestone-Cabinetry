name: Server Staging Deploy

on:
  push:
    tags:
      - 'milestone-staging-v*'
  workflow_dispatch:

concurrency:
  group: server-staging-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy-server:
    name: Deploy server with CDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: infra/yarn.lock

      - name: Install infrastructure dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Validate infrastructure
        run: |
          yarn typecheck
          yarn lint
          yarn test

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: milestone-server-cdk-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify deployment account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "441176049535"

      - name: Synthesize and inspect changes
        run: |
          yarn cdk synth --strict
          yarn cdk diff --strict

      - name: Deploy foundation
        run: yarn deploy:foundation

      - name: Initialize database roles
        run: yarn bootstrap:database

      - name: Deploy application
        run: yarn deploy:application --exclusively

      - name: Verify health endpoint
        run: yarn health

      - name: Check CloudFormation drift
        run: yarn drift

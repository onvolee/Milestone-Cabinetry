name: All Staging Deploy

on:
  push:
    tags:
      - 'milestone-staging-v*'
  workflow_dispatch:

concurrency:
  group: all-deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-server:
    name: Deploy server to staging
    runs-on: ubuntu-latest
    environment: env
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      ECR_REPOSITORY: milestone-server-staging
      ECS_CLUSTER: milestone-server
      ECS_SERVICE: milestone-server-staging-service
      ECS_TASK_DEFINITION: milestone-staging
      ECS_CONTAINER_NAME: milestone-staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate AWS credentials config
        if: ${{ env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == '' }}
        run: |
          echo "Missing staging AWS credentials."
          echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in the GitHub environment named env."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          LATEST_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

          docker build \
            --platform linux/amd64 \
            --tag "$IMAGE_URI" \
            --tag "$LATEST_IMAGE_URI" \
            ./server

          docker push "$IMAGE_URI"
          docker push "$LATEST_IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Create new ECS task definition revision
        id: task-def
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition \
            --output json > task-definition.json

          jq \
            --arg container "$ECS_CONTAINER_NAME" \
            --arg image "$IMAGE_URI" \
            '
            del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy
            )
            | .containerDefinitions |= map(
                if .name == $container
                then .image = $image
                else .
                end
              )
            ' task-definition.json > new-task-definition.json

          NEW_TASK_DEFINITION_ARN="$(
            aws ecs register-task-definition \
              --cli-input-json file://new-task-definition.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text
          )"

          echo "task-definition-arn=$NEW_TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.task-def.outputs.task-definition-arn }}"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

  deploy-portal:
    name: Deploy portal to staging
    runs-on: ubuntu-latest
    environment: env
    defaults:
      run:
        working-directory: portal
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOY_STAGE: staging
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Validate AWS credentials config
        if: ${{ env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == '' }}
        run: |
          echo "Missing staging AWS credentials."
          echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in the GitHub environment named env."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy portal
        run: yarn run sst deploy --stage "$DEPLOY_STAGE"

  deploy-admin:
    name: Deploy admin to staging
    runs-on: ubuntu-latest
    environment: env
    defaults:
      run:
        working-directory: admin
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: milestone-admin-staging
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.ADMIN_STAGING_CLOUDFRONT_DISTRIBUTION_ID || '' }}
      VITE_API: ${{ vars.ADMIN_STAGING_VITE_API || 'https://api.staging.milestonecabinetry.com/api' }}
      VITE_SHOP_URL: ${{ vars.ADMIN_STAGING_VITE_SHOP_URL || 'https://staging.milestonecabinetry.com' }}
      VITE_COOKIE_DOMAIN: ${{ vars.ADMIN_STAGING_VITE_COOKIE_DOMAIN || '.milestonecabinetry.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Validate AWS credentials config
        if: ${{ env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == '' }}
        run: |
          echo "Missing staging AWS credentials."
          echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in the GitHub environment named env."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build admin
        run: yarn build

      - name: Sync admin build to S3
        run: aws s3 sync dist/ "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

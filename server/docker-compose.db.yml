services:
  postgres:
    image: postgres:18
    container_name: milestone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in server/.env.local}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in server/.env.local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env.local}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?set MIGRATION_DB_PASSWORD in server/.env.local}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in server/.env.local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - milestone-pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:?set POSTGRES_USER in server/.env.local} -d ${POSTGRES_DB:?set POSTGRES_DB in server/.env.local}'
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  milestone-pgdata:

name: portal staging deploy

on:
  push:
    tags:
      - 'portal-test-v*'
  workflow_dispatch:

concurrency:
  group: all-deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-portal:
    name: Deploy portal to staging
    runs-on: ubuntu-latest
    environment: env
    defaults:
      run:
        working-directory: portal
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      DEPLOY_STAGE: staging
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Validate AWS credentials config
        if: ${{ env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == '' }}
        run: |
          echo "Missing staging AWS credentials."
          echo "Set AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY in the GitHub environment named env."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy portal
        run: yarn run sst deploy --stage "$DEPLOY_STAGE"
